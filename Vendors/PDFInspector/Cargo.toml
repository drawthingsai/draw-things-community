[package]
name = "pdf-inspector-dependencies"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
path = "fake.rs"

[dependencies]
thiserror = "2.0"
log = "0.4"
regex = "1.10"
once_cell = "1.19"
include_dir = "0.7"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
ttf-parser = "0.25"
lopdf = { version = "=0.45.0", features = ["rayon"] }
rayon = "1.10"
env_logger = "0.11"
